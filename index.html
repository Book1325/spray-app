<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#23343a"><title>สมุดงานรายวัน</title>
<style>
:root{font-family:"Noto Sans Thai","Sarabun",sans-serif;--ink:#23343a;--paper:#f7f4ec;--white:#fffefa;--line:#e8e3d8;--coral:#e9785c;--sage:#dbe7d5;--leaf:#477458;--muted:#77858a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);padding-bottom:90px;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh}
.top{background:var(--ink);color:white;padding:20px 20px 26px;border-radius:0 0 30px 30px}.topline,.top-foot,.month-head,.job-top,.section-head{display:flex;align-items:center;justify-content:space-between}.brand{font-size:13px;letter-spacing:.13em;font-weight:800}.brand b{color:#f0c969}.today-pill{font-size:11px;border:1px solid #ffffff30;padding:6px 10px;border-radius:20px;color:#e7ede5;background:transparent}.greeting{margin:24px 0 5px;color:#bdc9c3;font-size:13px}.top h1{font-size:25px;line-height:1.25;margin:0}.top h1 span{color:#f0c969}.top-foot{margin-top:18px}.date-big{font-size:13px;color:#d0d9d3}.total-badge{background:#34474d;padding:8px 12px;border-radius:13px;font-size:12px}main{padding:0 16px}
.month-card{margin-top:-11px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px #26383a0a}.month-title{font-size:16px;font-weight:800}.month-actions{display:flex;gap:7px}.icon{width:34px;height:34px;border:0;border-radius:11px;background:var(--paper);color:var(--ink);font-size:18px}.icon.today{width:auto;padding:0 11px;font-size:11px;font-weight:750;background:var(--sage)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;font-size:10px;color:var(--muted);padding:2px 0 5px}.day{height:48px;border:0;background:transparent;border-radius:12px;color:var(--ink);display:flex;align-items:center;flex-direction:column;padding:6px 2px 3px;gap:2px;font-size:12px}.day.dim{visibility:hidden}.day.selected{background:var(--ink);color:white}.day.today:not(.selected){outline:1.5px solid var(--coral);color:#b64f38;font-weight:800}.marks{display:flex;gap:3px;height:5px}.mark{width:5px;height:5px;border-radius:50%;background:var(--coral)}.mark.paid{background:#79a889}
.section-head{margin:23px 2px 10px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.agenda{display:flex;flex-direction:column;gap:9px}.job{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:13px 14px}.job-label{font-size:11px;font-weight:800;color:var(--leaf)}.status{font-size:10px;border-radius:20px;padding:4px 8px;background:var(--sage);color:#42674b}.status.wait{background:#f7e6de;color:#a3513d}.job-text{font-size:14px;font-weight:650;margin:7px 0 9px;white-space:pre-wrap}.job-meta{display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:8px;background:var(--paper);padding:5px 8px;font-size:10px;color:#657279}.small{border:0;border-radius:9px;padding:6px 9px;background:var(--paper);color:var(--ink);font-size:11px}.small.del{color:#b64f38}.empty{background:#efede4;border:1px dashed #d5d0c3;padding:22px 15px;border-radius:17px;text-align:center;color:#748078;font-size:13px}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.sum{background:#e6ebdf;padding:11px;border-radius:14px}.sum small{display:block;color:#718074;font-size:10px}.sum strong{font-size:14px}.add{position:fixed;right:18px;bottom:22px;border:0;border-radius:17px;background:var(--coral);color:white;padding:14px 18px;box-shadow:0 8px 22px #bc60474a;font-weight:750}
.overlay{display:none;position:fixed;inset:0;background:#17252ac2;z-index:5;align-items:end;justify-content:center}.overlay.open{display:flex}.modal{width:min(100%,600px);max-height:94dvh;overflow:auto;background:var(--white);border-radius:25px 25px 0 0;padding:17px 18px calc(20px + env(safe-area-inset-bottom))}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:19px}.x{border:0;border-radius:12px;width:36px;height:36px;background:var(--paper);font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#718078;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fcfaf5;padding:11px;border-radius:12px;color:var(--ink);font-size:16px}.field textarea{min-height:72px;resize:vertical}.checks{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:6px;background:#f0f2e9;padding:8px 10px;border-radius:10px;font-size:12px}.modal-actions{display:flex;gap:8px;margin-top:14px}.save,.cancel{flex:1;border:0;border-radius:13px;padding:13px;font-weight:750}.save{background:var(--ink);color:white}.cancel{background:var(--paper);color:var(--ink)}.notice{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:white;padding:9px 14px;border-radius:20px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.notice.show{opacity:1}
@media(min-width:640px){body{padding:22px 0 40px}.top{border-radius:30px;padding:24px 26px 28px}.app{padding:0 14px}.overlay{align-items:center}.modal{border-radius:25px}.day{height:56px}.month-card{padding:17px}}
</style></head><body><div class="app">
<header class="top"><div class="topline"><div class="brand">FIELD <b>／</b> NOTE</div><button class="today-pill" id="importBtn" type="button">นำเข้าคิวเดิม ⤴</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p class="greeting">จัดคิวให้ชัด จบงานได้สบาย</p><h1>สมุดงาน<br><span>รายวัน</span></h1><div class="top-foot"><div class="date-big" id="todayHuman"></div><div class="total-badge" id="jobCount">0 คิวในเดือนนี้</div></div></header>
<main><section class="month-card"><div class="month-head"><div class="month-title" id="monthTitle"></div><div class="month-actions"><button class="icon today" id="goToday">วันนี้</button><button class="icon" id="prev">‹</button><button class="icon" id="next">›</button></div></div><div class="grid" id="calendar"></div></section>
<div class="section-head"><h2 id="selectedTitle">คิวของวันนี้</h2><span id="selectedHint">เลือกวันจากปฏิทิน</span></div><section class="agenda" id="agenda"></section>
<section class="summary"><div class="sum"><small>รายรับเดือนนี้</small><strong id="incomeTotal">฿0</strong></div><div class="sum"><small>รายจ่ายเดือนนี้</small><strong id="expenseTotal">฿0</strong></div><div class="sum"><small>พื้นที่รวม</small><strong id="raiTotal">0 ไร่</strong></div></section></main></div>
<button class="add" id="addBtn">＋ เพิ่มคิว</button><div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle">เพิ่มคิว</h2><button class="x" id="close">×</button></div>
<form id="form"><div class="form"><div class="field full"><label for="date">วันที่</label><input id="date" type="date" required></div><div class="field full"><label for="work">รายละเอียดงาน</label><textarea id="work" placeholder="แปลงไหน / พ่นอะไร / นัดกับใคร"></textarea></div><div class="field"><label for="rai">พื้นที่ (ไร่)</label><input id="rai" type="number" min="0" step="0.25" placeholder="0"></div><div class="field"><label for="income">รายรับ (บาท)</label><input id="income" type="number" min="0" placeholder="0"></div><div class="field"><label for="expense">รายจ่าย (บาท)</label><input id="expense" type="number" min="0" placeholder="0"></div><div class="field"><label for="payment">รับเงินแบบ</label><select id="payment"><option>เงินสด</option><option>โอน</option><option>ยังไม่รับ</option></select></div><div class="field full"><label>สถานะงาน</label><div class="checks"><label class="check"><input id="done" type="checkbox"> ทำเสร็จแล้ว</label><label class="check"><input id="paid" type="checkbox"> รับเงินแล้ว</label></div></div><div class="field full"><label for="note">บันทึกเพิ่มเติม</label><textarea id="note" placeholder="หมายเหตุ"></textarea></div></div><div class="modal-actions"><button class="cancel" type="button" id="cancel">ยกเลิก</button><button class="save" type="submit">บันทึกคิว</button></div><button type="button" id="delete" class="small del" style="display:none;margin-top:10px;width:100%">ลบคิวนี้</button></form></section></div><div class="notice" id="notice"></div>
<script>
const KEY='fieldbook_fresh_v1',months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],weekdays=['อา','จ','อ','พ','พฤ','ศ','ส'];
let data=read(),cursor=new Date(),selected=iso(new Date()),editing=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateTH(s){let d=new Date(s+'T00:00:00');return d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543)}
function money(n){return '฿'+(Number(n)||0).toLocaleString('th-TH',{maximumFractionDigits:0})}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function amount(v){if(v===undefined||v===null||v==='')return 0;return Number(String(v).replace(/,/g,''))||0}
function fromOld(r){
 const incs=Array.isArray(r.incomeItems)?r.incomeItems:[],exps=Array.isArray(r.expenseItems)?r.expenseItems:[];
 const income=incs.length?incs.reduce((n,x)=>n+amount(x.amount),0):amount(r.income);
 const expense=exps.length?exps.reduce((n,x)=>n+amount(x.amount),0):amount(r.expense);
 const rai=incs.reduce((n,x)=>n+amount(x.rai),0);
 const work=[r.morning&&('เช้า: '+r.morning),r.evening&&('เย็น: '+r.evening)].filter(Boolean).join(String.fromCharCode(10));
 const details=[];
 if(r.note)details.push('บันทึกเดิม: '+r.note);
 if(incs.length)details.push('รายรับเดิม: '+incs.map(x=>(x.name||'รายการ')+' '+amount(x.amount)+' บาท'+(x.rai?' ('+x.rai+' ไร่)':'')).join(' · '));
 if(exps.length)details.push('รายจ่ายเดิม: '+exps.map(x=>(x.name||'รายการ')+' '+amount(x.amount)+' บาท').join(' · '));
 const types=[...new Set(incs.map(x=>x.paymentType).filter(Boolean))];
 return {date:r.date,work,rai,income,expense,payment:r.status&&r.status.paid?'รับแล้ว':(types.length===1?types[0]:(types.length?'ผสม':'ยังไม่รับ')),done:!!(r.status&&(r.status.morning||r.status.evening)),paid:!!(r.status&&r.status.paid),note:details.join(String.fromCharCode(10)),legacy:r};
}
function importOldRows(rows,merge=true){
 if(!Array.isArray(rows))throw Error('bad file');let n=0;
 rows.map(fromOld).forEach(r=>{if(!r.date)return;if(merge&&data[r.date])return;data[r.date]=r;n++});
 localStorage.setItem(KEY,JSON.stringify(data));render();return n;
}
function initLegacy(){
 try{if(!Object.keys(data).length){let old=JSON.parse(localStorage.getItem('spray_rows')||'null');if(Array.isArray(old)&&old.length){importOldRows(old,false);toast('เชื่อมข้อมูลเดิมแล้ว')}}}catch{}
}
function toast(s){let n=document.getElementById('notice');n.textContent=s;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}
function render(){let y=cursor.getFullYear(),m=cursor.getMonth(),today=iso(new Date()),prefix=y+'-'+String(m+1).padStart(2,'0');document.getElementById('monthTitle').textContent=months[m]+' '+(y+543);document.getElementById('todayHuman').textContent=dateTH(today);let inc=0,exp=0,rai=0,count=0;Object.values(data).forEach(r=>{if(r.date.startsWith(prefix)){inc+=+r.income||0;exp+=+r.expense||0;rai+=+r.rai||0;count++}});document.getElementById('jobCount').textContent=count+' คิวในเดือนนี้';document.getElementById('incomeTotal').textContent=money(inc);document.getElementById('expenseTotal').textContent=money(exp);document.getElementById('raiTotal').textContent=(+rai.toFixed(2))+' ไร่';let g=document.getElementById('calendar');g.innerHTML='';weekdays.forEach(w=>{let e=document.createElement('div');e.className='dow';e.textContent=w;g.append(e)});let start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<start;i++){let e=document.createElement('div');e.className='day dim';g.append(e)}for(let d=1;d<=days;d++){let date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),r=data[date],b=document.createElement('button');b.className='day'+(date===selected?' selected':'')+(date===today?' today':'');b.innerHTML='<span>'+d+'</span>';if(r){let marks=document.createElement('span');marks.className='marks';marks.innerHTML='<i class="mark"></i>'+(r.paid?'<i class="mark paid"></i>':'');b.append(marks)}b.onclick=()=>{selected=date;render()};g.append(b)}document.getElementById('selectedTitle').textContent=selected===today?'คิวของวันนี้':'คิววันที่ '+dateTH(selected);document.getElementById('selectedHint').textContent=data[selected]?'แตะรายการเพื่อแก้ไข':'ยังไม่มีคิว';let a=document.getElementById('agenda');a.innerHTML='';let r=data[selected];if(!r){a.innerHTML='<div class="empty"><b>วันนี้ยังว่างอยู่ 🌱</b>เพิ่มคิวให้วันนี้ได้เมื่อพร้อม</div>';return}let c=document.createElement('article');c.className='job';let top=document.createElement('div');top.className='job-top';let label=document.createElement('span');label.className='job-label';label.textContent='งานประจำวัน';let st=document.createElement('span');st.className='status'+(r.done?'':' wait');st.textContent=r.done?'เสร็จแล้ว':'รอดำเนินการ';top.append(label,st);let work=document.createElement('div');work.className='job-text';work.textContent=r.work||'ยังไม่ได้ใส่รายละเอียดงาน';let meta=document.createElement('div');meta.className='job-meta';[[money(r.income),'รายรับ'],[money(r.expense),'รายจ่าย'],[(r.rai||0)+' ไร่','พื้นที่'],[r.payment||'เงินสด','รับเงิน']].forEach(x=>{let t=document.createElement('span');t.className='tag';t.textContent=x[1]+': '+x[0];meta.append(t)});let tools=document.createElement('div');tools.style.marginTop='10px';let edit=document.createElement('button');edit.className='small';edit.textContent='แก้ไข';edit.onclick=()=>open(selected);let del=document.createElement('button');del.className='small del';del.textContent='ลบ';del.onclick=()=>{if(confirm('ลบคิวนี้หรือไม่?')){delete data[selected];persist();toast('ลบคิวแล้ว')}};tools.append(edit,del);c.append(top,work,meta,tools);a.append(c)}
function open(date){editing=date;let r=data[date]||{};document.getElementById('modalTitle').textContent=r.date?'แก้ไขคิว':'เพิ่มคิว';document.getElementById('date').value=date;document.getElementById('work').value=r.work||'';document.getElementById('rai').value=r.rai??'';document.getElementById('income').value=r.income??'';document.getElementById('expense').value=r.expense??'';document.getElementById('payment').value=r.payment||'เงินสด';document.getElementById('done').checked=!!r.done;document.getElementById('paid').checked=!!r.paid;document.getElementById('note').value=r.note||'';document.getElementById('delete').style.display=r.date?'block':'none';document.getElementById('overlay').classList.add('open')}
function close(){document.getElementById('overlay').classList.remove('open')}
document.getElementById('form').onsubmit=e=>{e.preventDefault();let date=document.getElementById('date').value;if(!date)return;if(editing&&editing!==date)delete data[editing];data[date]={date,work:document.getElementById('work').value.trim(),rai:+document.getElementById('rai').value||0,income:+document.getElementById('income').value||0,expense:+document.getElementById('expense').value||0,payment:document.getElementById('payment').value,done:document.getElementById('done').checked,paid:document.getElementById('paid').checked,note:document.getElementById('note').value.trim(),legacy:(data[editing]||{}).legacy};selected=date;cursor=new Date(date+'T00:00:00');close();persist();toast('บันทึกคิวแล้ว')};
document.getElementById('delete').onclick=()=>{if(editing&&confirm('ลบคิวนี้หรือไม่?')){delete data[editing];close();persist();toast('ลบคิวแล้ว')}};document.getElementById('addBtn').onclick=()=>open(selected);document.getElementById('close').onclick=document.getElementById('cancel').onclick=close;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')close()};document.getElementById('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};document.getElementById('goToday').onclick=()=>{cursor=new Date();selected=iso(cursor);render()};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let rows=JSON.parse(await f.text());let n=importOldRows(rows,true);toast('นำเข้า '+n+' คิวแล้ว')}catch{toast('ไฟล์ไม่ใช่ข้อมูลคิวที่รองรับ')}e.target.value=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft'&&!document.querySelector('.overlay.open'))document.getElementById('prev').click();if(e.key==='ArrowRight'&&!document.querySelector('.overlay.open'))document.getElementById('next').click()});initLegacy();render();
</script></body></html>

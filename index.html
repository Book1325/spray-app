<header class="top"><div class="topline"><div class="brand">FIELD <b>／</b> NOTE</div><span class="today-pill cloud-status" id="cloudStatus">เชื่อมต่อคลาวด์…</span><button class="today-pill" id="importBtn" type="button">นำเข้าคิวเดิม ⤴</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p class="greeting">จัดคิวให้ชัด จบงานได้สบาย</p><h1>สมุดงาน<br><span>รายวัน</span></h1><div class="top-foot"><div class="date-big" id="todayHuman"></div><div class="total-badge" id="jobCount">0 คิวในเดือนนี้</div></div></header>
<main><section class="month-card"><div class="month-head"><div class="month-title" id="monthTitle"></div><div class="month-actions"><button class="icon today" id="goToday">วันนี้</button><button class="icon" id="prev">‹</button><button class="icon" id="next">›</button></div></div><button class="unpaid-trigger" id="unpaidBtn" type="button"></button><div class="grid" id="calendar"></div></section>

iv class="notice" id="notice"></div>
<script>
const KEY='fieldbook_fresh_v1',months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],weekdays=['อา','จ','อ','พ','พฤ','ศ','ส'];
let data=upgrade(read()),cursor=new Date(),selected=iso(new Date()),editing=null,crewState={morning:[],evening:[]},knownNames=readNames();
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
const PEOPLE_KEY='fieldbook_people_v1';
function readNames(){try{return JSON.parse(localStorage.getItem(PEOPLE_KEY)||'[]')}catch{return []}}
function parseCrew(v){if(Array.isArray(v))return v.map(x=>String(x).trim()).filter(Boolean);return String(v||'').split(/\s*[-–,，、]\s*/).map(x=>x.trim()).filter(Boolean)}
function crewValue(r,k){let arr=r[k+'Names'];return arr&&arr.length?arr:parseCrew(r[k])}
function renderCrew(k){let selected=document.getElementById(k+'Selected'),suggestions=document.getElementById(k+'Suggestions');selected.innerHTML='';suggestions.innerHTML='';crewState[k].forEach((name,i)=>{let b=document.createElement('button');b.type='button';b.className='crew-chip';b.textContent=name;let x=document.createElement('span');x.textContent='×';b.append(x);b.onclick=()=>{crewState[k].splice(i,1);renderCrew(k)};selected.append(b)});knownNames.filter(n=>!crewState[k].includes(n)).forEach(name=>{let b=document.createElement('button');b.type='button';b.textContent='+ '+name;b.onclick=()=>{crewState[k].push(name);renderCrew(k)};suggestions.append(b)})}
function addCrew(k){let input=document.getElementById(k+'Input'),name=input.value.trim();if(!name)return;if(!crewState[k].includes(name))crewState[k].push(name);if(!knownNames.includes(name)){knownNames.unshift(name);localStorage.setItem(PEOPLE_KEY,JSON.stringify(knownNames))}input.value='';renderCrew(k)}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateTH(s){let d=new Date(s+'T00:00:00');return d.getDate()+' '+months[d.getMonth()]+' '+(d.getFullYear()+543)}
function amount(v){return Number(String(v||0).replace(/,/g,''))||0}
function incomeSum(r){return (r.incomeItems||[]).reduce((n,x)=>n+amount(x.amount),0)}
function expenseSum(r){return (r.expenseItems||[]).reduce((n,x)=>n+amount(x.amount),0)}
function raiSum(r){return (r.incomeItems||[]).reduce((n,x)=>n+amount(x.rai),0)}
function money(n){return '฿'+amount(n).toLocaleString('th-TH',{maximumFractionDigits:0})}
function fromOld(r){
 let st=r.status||{}, inc=Array.isArray(r.incomeItems)?r.incomeItems.map(x=>({name:x.name||'',amount:amount(x.amount),rai:amount(x.rai),paymentType:x.paymentType||'เงินสด',done:!!(x.done??((x.morningDone??st.morning??r.morningDone)&&(x.eveningDone??st.evening??r.eveningDone))),paid:!!(x.paid??st.paid??r.paid)})):[];
 const exp=Array.isArray(r.expenseItems)?r.expenseItems.map(x=>({name:x.name||'',amount:amount(x.amount),paymentType:x.paymentType||'เงินสด'})):[];
